name: Build and Release

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing numeric tag to build and release (for example 0.2.0)'
        required: true
        default: '0.2.0'
        type: string

permissions:
  contents: read

concurrency:
  group: binary-manager-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      GOTOOLCHAIN: local
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version && format('refs/tags/{0}', github.event.inputs.version) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check release identity and tagged source
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release.mjs --git
          echo "version=$(node --input-type=module -e 'import c from "./page/plugin.config.js"; console.log(c.version)')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test backend, including Unix-socket integration
        working-directory: backend
        env:
          BINARY_MANAGER_TEST_RACE: '1'
          BINARY_MANAGER_TEST_STORAGE: ${{ runner.temp }}
        run: |
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -race -count=1 -timeout=8m ./...
      - name: Test protected environment files with root-owned temporary fixtures
        working-directory: backend
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOCACHE="$RUNNER_TEMP/go-root-cache" \
            BINARY_MANAGER_GO="$(command -v go)" BINARY_MANAGER_TEST_STORAGE="$RUNNER_TEMP" \
            BINARY_MANAGER_REQUIRE_ROOT_TEST=1 \
            "$(command -v go)" test -count=1 -timeout=2m -run '^TestRootProtectedEnvFileEndToEnd$' .
      - name: Install locked frontend dependencies
        working-directory: page
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build frontend
        working-directory: page
        run: |
          npm test
          npm run build
          npm run package
      - name: Verify release packages
        run: |
          node --test tests/*.test.mjs
          python3 tests/review_packages.py
          node scripts/check-release.mjs --artifacts
          bash -n functions scripts/install-local.sh tests/fixtures/*.sh
      - name: Make source bundle with matching checksums
        run: |
          mkdir -p checksums
          cp artifacts/*.deb.md5 artifacts/*.deb.sha256 checksums/
          python3 scripts/make-source.py
      - uses: actions/upload-artifact@v7
        with:
          name: binary-manager-${{ steps.metadata.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: binary-manager-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish complete release for the tested existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release.mjs --artifacts
          # Refuse an existing release rather than silently replacing its assets.
          # Stage all assets in a draft so Hub cannot observe a partial release.
          gh release create "$RELEASE_TAG" artifacts/*.deb artifacts/*.deb.md5 artifacts/*.deb.sha256 artifacts/*-source.zip \
            --verify-tag --draft --title "MOS Binary Manager $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
